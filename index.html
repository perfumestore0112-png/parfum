<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العطور الفاخرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #ffffff;
            --accent-color: #d4af37;
            --bg-color: #f9f9f9;
            --text-color: #333333;
            --light-gray: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            position: relative;
        }

        header {
            background-color: var(--primary-color);
            color: var(--accent-color);
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 3px solid var(--accent-color);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            color: var(--secondary-color);
        }

        /* تنسيق شريط البحث الجديد */
        .search-container {
            text-align: center;
            margin: 2rem auto 0;
            max-width: 500px;
            padding: 0 1rem;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid var(--light-gray);
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--accent-color);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 1.5rem 1rem 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary-color);
            color: var(--accent-color);
            border-color: var(--primary-color);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding: 0 2rem 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background-color: var(--secondary-color);
            border: 1px solid var(--light-gray);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: var(--accent-color);
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 2px solid var(--accent-color);
        }

        .product-info {
            padding: 1.5rem;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-weight: 700;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--secondary-color);
            width: 90%;
            max-width: 800px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: row;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            color: var(--primary-color);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
            background-color: rgba(255,255,255,0.8);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-img-container {
            flex: 1;
            background-color: #f1f1f1;
        }

        .modal-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-details {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-category {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 0.5rem;
        }

        .modal-title {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .modal-price {
            font-size: 1.5rem;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .modal-meta {
            margin-bottom: 1rem;
        }

        .modal-meta p {
            margin-bottom: 0.5rem;
        }

        .modal-meta strong {
            color: var(--primary-color);
        }

        .modal-desc {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .order-btn {
            background-color: var(--primary-color);
            color: var(--accent-color);
            border: none;
            padding: 12px 0;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-align: center;
        }

        .order-btn:hover {
            background-color: #333;
        }

        /* تنسيق زر السلة العائم */
        #floating-cart {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background-color: var(--accent-color);
            color: var(--primary-color);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: transform 0.3s ease;
        }

        #floating-cart:hover {
            transform: scale(1.1);
        }

        #cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
                max-height: 90vh;
                overflow-y: auto;
            }
            .modal-img-container {
                height: 300px;
                flex: none;
            }
            header h1 {
                font-size: 2rem;
            }
        }

        #loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 2rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="storeNameText">متجر العطور</h1>
        <p>اكتشف جوهر الأناقة والجاذبية</p>
    </header>

    <!-- شريط البحث الجديد -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="ابحث عن عطر بالاسم أو الماركة...">
    </div>

    <div class="filters" id="filters-container">
        <!-- ستتم إضافتها تلقائياً -->
    </div>

    <div id="loader">جاري تحميل أحدث العطور من النظام...</div>

    <div class="product-grid" id="product-grid">
        <!-- سيتم حقن البطاقات هنا -->
    </div>

    <!-- زر السلة العائم -->
    <button id="floating-cart" style="display: none;">
        🛒
        <span id="cart-badge">0</span>
    </button>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">&times;</button>

            <div class="modal-img-container">
                <img src="" alt="Product Image" class="modal-img" id="modal-img">
            </div>

            <div class="modal-details">
                <div class="modal-category" id="modal-category">صنف العطر</div>
                <h2 class="modal-title" id="modal-title">اسم العطر</h2>
                <div class="modal-price"><span id="modal-price">0</span> ر.س</div>

                <div class="modal-meta">
                    <p><strong>الماركة:</strong> <span id="modal-size">...</span></p>
                    <p><strong>الباركود:</strong> <span id="modal-notes">...</span></p>
                </div>

                <p class="modal-desc" id="modal-desc">وصف المنتج سيظهر هنا...</p>

                <button class="order-btn" id="add-to-cart-btn">أضف إلى السلة 🛒</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKPkhaeR9PNocBPErv9CH6sqEbcPYRyvfqaT7swugc32Ypr3VzI3iNAUilyYNKSjLr/exec';
        let storePhoneNumber = '';
        let storeName = 'متجر العطور';

        let allProducts = [];
        let currentFilter = 'الكل';
        let cart = []; // مصفوفة السلة الجديدة

        const productGrid = document.getElementById('product-grid');
        const filtersContainer = document.getElementById('filters-container');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('search-input');
        
        const modalOverlay = document.getElementById('modal-overlay');
        const closeModalBtn = document.getElementById('close-modal');
        const addToCartBtn = document.getElementById('add-to-cart-btn');
        const floatingCart = document.getElementById('floating-cart');
        const cartBadge = document.getElementById('cart-badge');
        
        let currentSelectedProduct = null;

        async function fetchProducts() {
            loader.style.display = 'block';
            productGrid.innerHTML = '';
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getPublicCatalog' })
                });

                if(!response.ok) throw new Error('فشل جلب البيانات');
                const result = await response.json();

                if (result.success && Array.isArray(result.data)) {
                    allProducts = result.data;
                    storePhoneNumber = result.storePhone || '';
                    if (result.storeName) {
                        storeName = result.storeName;
                        document.getElementById('storeNameText').textContent = storeName;
                        document.title = storeName;
                    }

                    setupDynamicFilters();
                    renderProducts(allProducts);
                } else {
                    throw new Error('بيانات غير صالحة');
                }
            } catch (error) {
                console.error('خطأ في جلب البيانات:', error);
                productGrid.innerHTML = '<p style="color:red; text-align:center; width:100%;">حدث خطأ أثناء تحميل المنتجات. الرجاء المحاولة لاحقاً.</p>';
            } finally {
                loader.style.display = 'none';
            }
        }

        // تفعيل شريط البحث
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.name && p.name.toLowerCase().includes(searchTerm)) || 
                (p.brand && p.brand.toLowerCase().includes(searchTerm))
            );
            
            // إعادة الفلتر إلى "الكل" عند البحث
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            const allBtn = document.querySelector('.filter-btn[data-filter="الكل"]');
            if(allBtn) allBtn.classList.add('active');
            
            renderProducts(filtered);
        });

        function setupDynamicFilters() {
            const families = new Set(allProducts.map(p => (p.family || p.brand || 'عطور عامة').trim()).filter(Boolean));
            const filterArray = ['الكل', ...Array.from(families).sort()];

            filtersContainer.innerHTML = filterArray.map(f =>
                `<button class="filter-btn ${f === 'الكل' ? 'active' : ''}" data-filter="${f}">${f}</button>`
            ).join('');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    searchInput.value = ''; // تفريغ البحث عند استخدام الفلاتر

                    currentFilter = btn.getAttribute('data-filter');

                    if (currentFilter === 'الكل') {
                        renderProducts(allProducts);
                    } else {
                        const filteredProducts = allProducts.filter(p => (p.family || p.brand || 'عطور عامة').trim() === currentFilter);
                        renderProducts(filteredProducts);
                    }
                });
            });
        }

        function getGenericImage(familyName) {
            const str = (familyName||'').toLowerCase();
            if(str.includes('نسائ')) return 'https://images.unsplash.com/photo-1594035910387-fea47794261f?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
            if(str.includes('رجال')) return 'https://images.unsplash.com/photo-1523293115678-efa3012b1860?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
            if(str.includes('عود') || str.includes('شرق')) return 'https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
            return 'https://images.unsplash.com/photo-1590736969955-71cc94801759?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
        }

        function renderProducts(productsToRender) {
            productGrid.innerHTML = '';

            if (productsToRender.length === 0) {
                productGrid.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-color);">لا توجد عطور مطابقة.</p>';
                return;
            }

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openModal(product);

                const imgUrl = product.image || getGenericImage(product.family);
                const price = Number(product.price || 0).toLocaleString();

                card.innerHTML = `
                    <img src="${imgUrl}" alt="${product.name}" class="product-img" loading="lazy">
                    <div class="product-info">
                        <h3 class="product-title">${product.name || 'عطر'}</h3>
                        <p style="color:#777; font-size:0.9rem; margin-bottom:5px;">${product.brand || product.family || ''}</p>
                        <p class="product-price">${price} ر.س</p>
                    </div>
                `;

                productGrid.appendChild(card);
            });
        }

        function openModal(product) {
            if (!product) return;
            currentSelectedProduct = product;

            const imgUrl = product.image || getGenericImage(product.family);
            const price = Number(product.price || 0).toLocaleString();

            document.getElementById('modal-img').src = imgUrl;
            document.getElementById('modal-title').textContent = product.name || 'عطر';
            document.getElementById('modal-category').textContent = `صنف: ${product.family || product.brand || 'عام'}`;
            document.getElementById('modal-price').textContent = price;

            document.getElementById('modal-size').textContent = product.brand ? product.brand : 'غير محدد';
            document.getElementById('modal-notes').textContent = product.barcode ? product.barcode : 'غير محدد';
            document.getElementById('modal-desc').textContent = product.description || 'لا يوجد وصف متاح حالياً لهذا العطر.';

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            currentSelectedProduct = null;
        }

        closeModalBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // وظيفة إضافة العطر للسلة
        addToCartBtn.addEventListener('click', () => {
            if (!currentSelectedProduct) return;
            
            cart.push(currentSelectedProduct);
            cartBadge.textContent = cart.length;
            floatingCart.style.display = 'flex';
            
            closeModal();
            
            // إشعار بسيط للمستخدم
            const notification = document.createElement('div');
            notification.textContent = 'تمت الإضافة إلى السلة بنجاح! 🛒';
            notification.style.cssText = 'position:fixed; top:20px; right:20px; background:var(--accent-color); color:#000; padding:15px; border-radius:5px; z-index:1001; font-weight:bold;';
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 2500);
        });

        // وظيفة إتمام الطلب عبر واتساب للطلبات المجمعة
        floatingCart.addEventListener('click', () => {
            if (cart.length === 0) return;
            if (!storePhoneNumber) {
                alert('لم يتم تعيين رقم هاتف للطلب. يرجى إضافة رقم المتجر في الإعدادات.');
                return;
            }

            let message = `مرحباً متجر ${storeName}، أود طلب العطور التالية:\n\n`;
            let totalPrice = 0;

            cart.forEach((item, index) => {
                const price = Number(item.price || 0);
                totalPrice += price;
                message += `${index + 1}. ${item.name} (${item.brand || 'بدون ماركة'}) - ${price.toLocaleString()} ر.س\n`;
            });

            message += `\nإجمالي الطلب: ${totalPrice.toLocaleString()} ر.س\n\nيرجى تزويدي بالتفاصيل. شكراً لك.`;

            let phone = storePhoneNumber.replace(/[^\d+]/g, '');
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
            
            // تصفير السلة بعد الطلب (اختياري)
            if(confirm('هل تم إرسال الطلب بنجاح عبر الواتساب؟ (سيتم إفراغ السلة)')){
                cart = [];
                cartBadge.textContent = '0';
                floatingCart.style.display = 'none';
            }
        });

        window.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
