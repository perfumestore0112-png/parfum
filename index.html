<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العطور الفاخرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #ffffff;
            --accent-color: #d4af37;
            --bg-color: #f9f9f9;
            --text-color: #333333;
            --light-gray: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            position: relative;
        }

        header {
            background-color: var(--primary-color);
            color: var(--accent-color);
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 3px solid var(--accent-color);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            color: var(--secondary-color);
        }

        /* تنسيق شريط البحث الجديد */
        .search-container {
            text-align: center;
            margin: 2rem auto 0;
            max-width: 500px;
            padding: 0 1rem;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid var(--light-gray);
            border-radius: 25px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-container input:focus {
            border-color: var(--accent-color);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 1.5rem 1rem 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: var(--primary-color);
            color: var(--accent-color);
            border-color: var(--primary-color);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding: 0 2rem 4rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background-color: var(--secondary-color);
            border: 1px solid var(--light-gray);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .out-of-stock-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #e74c3c;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .product-card.out-of-stock .product-img {
            filter: grayscale(80%) opacity(0.8);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: var(--accent-color);
        }

        .product-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-bottom: 2px solid var(--accent-color);
        }

        .product-info {
            padding: 1.5rem;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.25rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--accent-color);
            font-weight: 700;
        }

        .old-price {
            font-size: 0.9rem;
            color: #999;
            text-decoration: line-through;
            margin-right: 8px;
        }

        .discount-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #e74c3c;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 10;
        }

        .countdown {
            background-color: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 5px;
            font-size: 0.85rem;
            font-weight: bold;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .stock-badge {
            font-size: 0.8rem;
            color: #d35400;
            font-weight: 700;
            margin-top: 5px;
        }

        .ads-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .ads-container::-webkit-scrollbar { display: none; }

        .ad-slide {
            flex: 0 0 calc(100% - 40px);
            max-width: 400px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .ad-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .ad-title {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            padding: 15px 10px 10px;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: var(--secondary-color);
            width: 90%;
            max-width: 800px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: row;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            color: var(--primary-color);
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
            background-color: rgba(255,255,255,0.8);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-img-container {
            flex: 1;
            background-color: #f1f1f1;
        }

        .modal-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-details {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .modal-category {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 0.5rem;
        }

        .modal-title {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .modal-price {
            font-size: 1.5rem;
            color: var(--accent-color);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .modal-meta {
            margin-bottom: 1rem;
        }

        .modal-meta p {
            margin-bottom: 0.5rem;
        }

        .modal-meta strong {
            color: var(--primary-color);
        }

        .modal-desc {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .order-btn {
            background-color: var(--primary-color);
            color: var(--accent-color);
            border: none;
            padding: 12px 0;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-align: center;
        }

        .order-btn:hover {
            background-color: #333;
        }

        /* تنسيق زر السلة العائم */
        #floating-cart {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background-color: var(--accent-color);
            color: var(--primary-color);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: transform 0.3s ease;
        }

        #floating-cart:hover {
            transform: scale(1.1);
        }

        #cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
                max-height: 90vh;
                overflow-y: auto;
            }
            .modal-img-container {
                height: 300px;
                flex: none;
            }
            header h1 {
                font-size: 2rem;
            }
        }

        #loader {
            text-align: center;
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 2rem;
            display: none;
        }

        /* ===== العروض ===== */
        .discount-badge{position:absolute;top:10px;left:10px;background:#c0392b;color:#fff;padding:5px 12px;border-radius:20px;font-size:.85rem;font-weight:700;z-index:10;box-shadow:0 2px 5px rgba(0,0,0,.2)}
        .old-price{color:#999;text-decoration:line-through;font-size:.95rem;font-weight:400;margin-inline-end:8px}
        .offer-label{display:inline-block;font-size:.8rem;color:#c0392b;font-weight:600;margin-bottom:4px}
        .countdown{font-size:.85rem;color:#c0392b;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums}
        .low-stock{font-size:.85rem;color:#e67e22;font-weight:600;margin-top:4px}
        .sort-select{margin-top:10px;padding:8px 16px;border:2px solid var(--light-gray);border-radius:25px;font-size:.95rem;background:#fff;cursor:pointer;outline:none}
        .sort-select:focus{border-color:var(--accent-color)}
        .filter-btn.offers{border-color:#c0392b;color:#c0392b}
        .filter-btn.offers:hover,.filter-btn.offers.active{background:#c0392b;color:#fff;border-color:#c0392b}
    </style>
</head>
<body>

    <header>
        <h1 id="storeNameText">متجر العطور</h1>
        <p>اكتشف جوهر الأناقة والجاذبية</p>
    </header>

    <!-- منطقة الإعلانات (Banners) تظهر فقط إذا وجدت إعلانات -->
    <div id="ads-container" class="ads-container" style="display:none; max-width:1200px; margin:20px auto; padding:0 20px;"></div>

    <!-- شريط البحث الجديد -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="ابحث عن عطر بالاسم أو الماركة...">
        <select id="sort-select" class="sort-select" aria-label="ترتيب العطور">
            <option value="default">الترتيب الافتراضي</option>
            <option value="discount">الأعلى خصماً</option>
            <option value="price-asc">الأقل سعراً</option>
            <option value="price-desc">الأعلى سعراً</option>
        </select>
    </div>

    <div class="filters" id="filters-container">
        <!-- ستتم إضافتها تلقائياً -->
    </div>

    <div id="loader">جاري تحميل أحدث العطور من النظام...</div>

    <div class="product-grid" id="product-grid">
        <!-- سيتم حقن البطاقات هنا -->
    </div>

    <!-- زر السلة العائم -->
    <button id="floating-cart" style="display: none;">
        🛒
        <span id="cart-badge">0</span>
    </button>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">&times;</button>

            <div class="modal-img-container">
                <img src="" alt="Product Image" class="modal-img" id="modal-img">
            </div>

            <div class="modal-details">
                <div class="modal-category" id="modal-category">صنف العطر</div>
                <h2 class="modal-title" id="modal-title">اسم العطر</h2>
                <div class="modal-price">
                    <span id="modal-price">0</span>
                    <span id="modal-old-price" class="old-price" style="display:none;"></span>
                </div>

                <div id="modal-countdown" style="color:#e74c3c; font-weight:bold; margin-bottom:15px; display:none;"></div>
                <div id="modal-stock-badge" style="color:#d35400; font-weight:bold; margin-bottom:15px; display:none;"></div>

                <div class="modal-meta">
                    <p><strong>الماركة:</strong> <span id="modal-brand">...</span></p>
                    <p id="modal-notes-container" style="display:none;"><strong>النفحات:</strong> <span id="modal-notes">...</span></p>
                </div>

                <p class="modal-desc" id="modal-desc">وصف المنتج سيظهر هنا...</p>

                <button class="order-btn" id="add-to-cart-btn">أضف إلى السلة 🛒</button>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKPkhaeR9PNocBPErv9CH6sqEbcPYRyvfqaT7swugc32Ypr3VzI3iNAUilyYNKSjLr/exec';
        let storePhoneNumber = '';
        let storeName = 'متجر العطور';

        let allProducts = [];
        let currentFilter = 'الكل';
        let cart = []; // مصفوفة السلة الجديدة

        const productGrid = document.getElementById('product-grid');
        const filtersContainer = document.getElementById('filters-container');
        const loader = document.getElementById('loader');
        const searchInput = document.getElementById('search-input');
        
        const modalOverlay = document.getElementById('modal-overlay');
        const closeModalBtn = document.getElementById('close-modal');
        const addToCartBtn = document.getElementById('add-to-cart-btn');
        const floatingCart = document.getElementById('floating-cart');
        const cartBadge = document.getElementById('cart-badge');
        
        let currentSelectedProduct = null;

        async function fetchProducts() {
            loader.style.display = 'block';
            productGrid.innerHTML = '';
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getPublicCatalog' })
                });

                if(!response.ok) throw new Error('فشل جلب البيانات');
                const result = await response.json();

                if (result.success && Array.isArray(result.data)) {
                    allProducts = result.data;
                    storePhoneNumber = result.storePhone || '';
                    if (result.storeName) {
                        storeName = result.storeName;
                        document.getElementById('storeNameText').textContent = storeName;
                        document.title = storeName;
                    }

                    if (result.ads && Array.isArray(result.ads)) {
                        renderAds(result.ads);
                    }

                    setupDynamicFilters();
                    renderProducts(allProducts);
                } else {
                    throw new Error('بيانات غير صالحة');
                }
            } catch (error) {
                console.error('خطأ في جلب البيانات:', error);
                productGrid.innerHTML = '<p style="color:red; text-align:center; width:100%;">حدث خطأ أثناء تحميل المنتجات. الرجاء المحاولة لاحقاً.</p>';
            } finally {
                loader.style.display = 'none';
            }
        }

        // تفعيل شريط البحث
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => 
                (p.name && p.name.toLowerCase().includes(searchTerm)) || 
                (p.brand && p.brand.toLowerCase().includes(searchTerm))
            );
            
            // إعادة الفلتر إلى "الكل" عند البحث
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            const allBtn = document.querySelector('.filter-btn[data-filter="الكل"]');
            if(allBtn) allBtn.classList.add('active');
            
            renderProducts(filtered);
        });

        function setupDynamicFilters() {
            const families = new Set(allProducts.map(p => (p.family || p.brand || 'عطور عامة').trim()).filter(Boolean));
            const filterArray = ['الكل', ...(allProducts.some(isOfferActive) ? [OFFERS_FILTER] : []), ...Array.from(families).sort()];

            filtersContainer.innerHTML = filterArray.map(f =>
                `<button class="filter-btn ${f === 'الكل' ? 'active' : ''} ${f === OFFERS_FILTER ? 'offers' : ''}" data-filter="${f}">${f}</button>`
            ).join('');

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    searchInput.value = ''; // تفريغ البحث عند استخدام الفلاتر

                    currentFilter = btn.getAttribute('data-filter');

                    if (currentFilter === 'الكل') {
                        renderProducts(allProducts);
                    } else if (currentFilter === OFFERS_FILTER) {
                        renderProducts(allProducts.filter(isOfferActive));
                    } else {
                        const filteredProducts = allProducts.filter(p => (p.family || p.brand || 'عطور عامة').trim() === currentFilter);
                        renderProducts(filteredProducts);
                    }
                });
            });
        }

        const OFFERS_FILTER = '🔥 العروض';
        let lastList = [];

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const pad = n => String(n).padStart(2, '0');

        function offerEnd(p) {
            if (!p.offerEndDate) return null;
            const t = new Date(p.offerEndDate).getTime();
            return isNaN(t) ? null : t;
        }
        function isOfferActive(p) {
            const o = Number(p.oldPrice || 0), n = Number(p.price || 0);
            if (!(o > n && n >= 0)) return false;
            const end = offerEnd(p);
            return end === null || end > Date.now();
        }
        function discountPct(p) { return Math.round((1 - Number(p.price) / Number(p.oldPrice)) * 100); }
        function discountBadge(p) { return isOfferActive(p) ? `<div class="discount-badge">-${discountPct(p)}%</div>` : ''; }
        function priceHtml(p) {
            const now = Number(p.price || 0).toLocaleString();
            return isOfferActive(p)
                ? `<span class="old-price">${Number(p.oldPrice).toLocaleString()}</span>${now} ر.س`
                : `${now} ر.س`;
        }
        function extrasHtml(p, outOfStock) {
            let h = '';
            if (isOfferActive(p)) {
                if (p.offerLabel) h += `<div class="offer-label">${esc(p.offerLabel)}</div>`;
                const end = offerEnd(p);
                if (end) h += `<div class="countdown" data-end="${end}"></div>`;
            }
            const st = p.currentStock != null ? Number(p.currentStock) : null;
            if (!outOfStock && st !== null && st > 0 && st <= 5) h += `<div class="low-stock">🔥 باقي ${st} ${st === 1 ? 'قطعة' : 'قطع'} فقط</div>`;
            return h;
        }
        function sortList(list) {
            const v = document.getElementById('sort-select').value, a = [...list];
            const d = p => isOfferActive(p) ? discountPct(p) : 0;
            if (v === 'discount') a.sort((x, y) => d(y) - d(x));
            else if (v === 'price-asc') a.sort((x, y) => Number(x.price) - Number(y.price));
            else if (v === 'price-desc') a.sort((x, y) => Number(y.price) - Number(x.price));
            return a;
        }
        function tick() {
            document.querySelectorAll('[data-end]').forEach(el => {
                const d = Number(el.dataset.end) - Date.now();
                if (d <= 0) { el.textContent = 'انتهى العرض'; return; }
                const h = Math.floor(d / 36e5), days = Math.floor(h / 24);
                el.textContent = '⏳ ينتهي خلال ' + (days ? days + ' يوم ' : '') + pad(h % 24) + ':' + pad(Math.floor(d % 36e5 / 6e4)) + ':' + pad(Math.floor(d % 6e4 / 1e3));
            });
        }

        function renderAds(ads) {
            const adContainer = document.getElementById('ads-container');
            if (!adContainer) return;
            if (!ads || ads.length === 0) {
                adContainer.style.display = 'none';
                return;
            }
            adContainer.style.display = 'block';

            adContainer.innerHTML = ads.map(a => `
                <div class="ad-slide" onclick="${a.link ? `window.open('${a.link}', '_blank')` : 'void(0)'}" style="${a.link ? 'cursor:pointer;' : ''}">
                    <img src="${a.image}" alt="${a.title}" class="ad-img">
                    <div class="ad-title">${a.title}</div>
                </div>
            `).join('');
        }

        function getGenericImage(familyName) {
            const str = (familyName||'').toLowerCase();
            if(str.includes('نسائ')) return 'https://images.unsplash.com/photo-1594035910387-fea47794261f?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
            if(str.includes('رجال')) return 'https://images.unsplash.com/photo-1523293115678-efa3012b1860?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
            if(str.includes('عود') || str.includes('شرق')) return 'https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
            return 'https://images.unsplash.com/photo-1590736969955-71cc94801759?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80';
        }

        function renderProducts(list) {
            lastList = list;
            const productsToRender = sortList(list);
            productGrid.innerHTML = '';

            if (productsToRender.length === 0) {
                productGrid.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-color);">لا توجد عطور مطابقة.</p>';
                return;
            }

            productsToRender.forEach(product => {
                const card = document.createElement('div');
                const isOutOfStock = product.currentStock != null && Number(product.currentStock) <= 0;

                card.className = 'product-card' + (isOutOfStock ? ' out-of-stock' : '');
                card.onclick = () => openModal(product);

                const imgUrl = product.image || getGenericImage(product.family);
                const currency = product.currency && product.currency.trim() !== '' ? product.currency : storeCurrency;
                const price = Number(product.price || 0).toLocaleString();

                card.innerHTML = `
                    ${isOutOfStock ? '<div class="out-of-stock-badge">نفدت الكمية</div>' : ''}
                    ${discountBadge(product)}
                    <img src="${imgUrl}" alt="${esc(product.name)}" class="product-img" loading="lazy">
                    <div class="product-info">
                        <h3 class="product-title">${esc(product.name) || 'عطر'}</h3>
                        <p style="color:#777; font-size:0.9rem; margin-bottom:5px;">${esc(product.brand || product.family)}</p>
                        <p class="product-price">${priceHtml(product)} ${currency}</p>
                        ${extrasHtml(product, isOutOfStock)}
                    </div>
                `;

                productGrid.appendChild(card);
            });
            tick();
        }

        function openModal(product) {
            if (!product) return;
            currentSelectedProduct = product;

            const isOutOfStock = product.currentStock != null && Number(product.currentStock) <= 0;

            const imgUrl = product.image || getGenericImage(product.family);
            const currency = product.currency && product.currency.trim() !== '' ? product.currency : storeCurrency;
            const price = Number(product.price || 0).toLocaleString();

            document.getElementById('modal-img').src = imgUrl;
            document.getElementById('modal-title').textContent = product.name || 'عطر';
            document.getElementById('modal-category').textContent = `صنف: ${product.family || product.brand || 'عام'}`;
            document.getElementById('modal-price').textContent = price + ' ' + currency;
            const active = isOfferActive(product), cd = document.getElementById('modal-countdown'), end = offerEnd(product);
            const oldEl = document.getElementById('modal-old-price');
            oldEl.textContent = active ? (Number(product.oldPrice).toLocaleString() + ' ' + currency) : '';
            if (active && end) { cd.dataset.end = end; tick(); } else { delete cd.dataset.end; cd.textContent = ''; }

            document.getElementById('modal-size').textContent = product.brand ? product.brand : 'غير محدد';
            document.getElementById('modal-notes').textContent = product.notes || '';
            document.getElementById('notes-row').style.display = product.notes ? '' : 'none';
            document.getElementById('modal-desc').textContent = product.description || 'لا يوجد وصف متاح حالياً لهذا العطر.';

            const addToCartBtn = document.getElementById('add-to-cart-btn');
            if (isOutOfStock) {
                addToCartBtn.textContent = 'نفدت الكمية';
                addToCartBtn.style.backgroundColor = '#95a5a6';
                addToCartBtn.style.cursor = 'not-allowed';
                addToCartBtn.disabled = true;
            } else {
                addToCartBtn.textContent = 'أضف إلى السلة 🛒';
                addToCartBtn.style.backgroundColor = 'var(--accent-color)';
                addToCartBtn.style.cursor = 'pointer';
                addToCartBtn.disabled = false;
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            currentSelectedProduct = null;
        }

        closeModalBtn.addEventListener('click', closeModal);

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // وظيفة إضافة العطر للسلة
        addToCartBtn.addEventListener('click', () => {
            if (!currentSelectedProduct) return;
            
            cart.push(currentSelectedProduct);
            cartBadge.textContent = cart.length;
            floatingCart.style.display = 'flex';
            
            closeModal();
            
            // إشعار بسيط للمستخدم
            const notification = document.createElement('div');
            notification.textContent = 'تمت الإضافة إلى السلة بنجاح! 🛒';
            notification.style.cssText = 'position:fixed; top:20px; right:20px; background:var(--accent-color); color:#000; padding:15px; border-radius:5px; z-index:1001; font-weight:bold;';
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 2500);
        });

        // وظيفة إتمام الطلب عبر واتساب للطلبات المجمعة
        floatingCart.addEventListener('click', () => {
            if (cart.length === 0) return;
            if (!storePhoneNumber) {
                alert('لم يتم تعيين رقم هاتف للطلب. يرجى إضافة رقم المتجر في الإعدادات.');
                return;
            }

            let message = `مرحباً متجر ${storeName}، أود طلب العطور التالية:\n\n`;
            let totalPrice = 0;
            // جمع العملة من أول منتج في السلة كعملة للطلب (أو العملة الافتراضية)
            let orderCurrency = storeCurrency;

            cart.forEach((item, index) => {
                const price = Number(item.price || 0);
                totalPrice += price;
                const currency = item.currency && item.currency.trim() !== '' ? item.currency : storeCurrency;
                if(index === 0) orderCurrency = currency;
                message += `${index + 1}. ${item.name} (${item.brand || 'بدون ماركة'}) - ${price.toLocaleString()} ${currency}\n`;
            });

            message += `\nإجمالي الطلب: ${totalPrice.toLocaleString()} ${orderCurrency}\n\nيرجى تزويدي بالتفاصيل. شكراً لك.`;

            let phone = storePhoneNumber.replace(/[^\d+]/g, '');
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phone}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
            
            // تصفير السلة بعد الطلب (اختياري)
            if(confirm('هل تم إرسال الطلب بنجاح عبر الواتساب؟ (سيتم إفراغ السلة)')){
                cart = [];
                cartBadge.textContent = '0';
                floatingCart.style.display = 'none';
            }
        });

        document.getElementById('sort-select').addEventListener('change', () => renderProducts(lastList));
        setInterval(tick, 1000);
        window.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
